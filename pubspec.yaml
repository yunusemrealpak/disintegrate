name: disintegrate
description: "Thanos-snap style disintegration for any Flutter widget, driven by a GPU fragment shader on Impeller instead of a CPU particle system."
version: 0.1.0
repository: https://github.com/yunusemrealpak/disintegrate
issue_tracker: https://github.com/yunusemrealpak/disintegrate/issues

topics:
  - animation
  - shader
  - effects
  - ui
  - impeller

environment:
  sdk: ^3.13.1
  # ImageFilter.shader landed in 3.41 and is Impeller-only.
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/disintegrate.frag
